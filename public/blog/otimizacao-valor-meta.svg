<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 480" role="img" aria-label="Comparação entre otimizar campanhas por volume de compras, que privilegia tickets baixos, e otimizar por valor, em que o algoritmo prioriza compradores de maior ticket e valor vitalício previsto">
  <style>
    text { font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif; }
    .title { font-size: 19px; font-weight: 700; fill: #111827; }
    .subtitle { font-size: 13px; fill: #6b7280; }
    .colTitle { font-size: 14px; font-weight: 700; }
    .colDesc { font-size: 11px; fill: #6b7280; }
    .cart { font-size: 11px; font-weight: 700; }
    .sum { font-size: 12.5px; font-weight: 700; fill: #111827; }
    .req { font-size: 11.5px; font-weight: 600; fill: #6b21a8; }
    .note { font-size: 11.5px; fill: #6b7280; }
  </style>

  <rect x="0" y="0" width="840" height="480" rx="16" fill="#ffffff" stroke="#e5e7eb"/>

  <text x="40" y="44" class="title">Otimizar por volume vs. otimizar por valor</text>
  <text x="40" y="66" class="subtitle">Para o modo padrão, o comprador de R$ 49 e o de R$ 490 valem o mesmo — a otimização de valor corrige o alvo</text>

  <!-- POR VOLUME -->
  <g>
    <rect x="40" y="92" width="370" height="240" rx="16" fill="#f9fafb" stroke="#e5e7eb"/>
    <text x="62" y="122" class="colTitle" fill="#6b7280">Por volume de compras (padrão)</text>
    <text x="62" y="142" class="colDesc">O algoritmo caça a compra mais provável — a mais barata</text>
    <!-- muitos carrinhos pequenos -->
    <g>
      <rect x="62" y="166" width="76" height="44" rx="10" fill="#d1d5db"/><text x="100" y="193" class="cart" fill="#374151" text-anchor="middle">R$ 49</text>
      <rect x="150" y="166" width="76" height="44" rx="10" fill="#d1d5db"/><text x="188" y="193" class="cart" fill="#374151" text-anchor="middle">R$ 59</text>
      <rect x="238" y="166" width="76" height="44" rx="10" fill="#d1d5db"/><text x="276" y="193" class="cart" fill="#374151" text-anchor="middle">R$ 49</text>
      <rect x="62" y="220" width="76" height="44" rx="10" fill="#d1d5db"/><text x="100" y="247" class="cart" fill="#374151" text-anchor="middle">R$ 39</text>
      <rect x="150" y="220" width="76" height="44" rx="10" fill="#d1d5db"/><text x="188" y="247" class="cart" fill="#374151" text-anchor="middle">R$ 69</text>
      <rect x="238" y="220" width="76" height="44" rx="10" fill="#d1d5db"/><text x="276" y="247" class="cart" fill="#374151" text-anchor="middle">R$ 55</text>
    </g>
    <text x="62" y="296" class="sum">6 compras · R$ 320 de receita</text>
    <text x="62" y="316" class="colDesc">CPA bonito no relatório, AOV caindo e margem espremida</text>
  </g>

  <!-- POR VALOR -->
  <g>
    <rect x="430" y="92" width="370" height="240" rx="16" fill="#faf5ff" stroke="#A100FF" stroke-opacity="0.4"/>
    <text x="452" y="122" class="colTitle" fill="#A100FF">Por valor (value optimization)</text>
    <text x="452" y="142" class="colDesc">O algoritmo prioriza o retorno previsto de cada impressão</text>
    <!-- poucos carrinhos grandes -->
    <g>
      <rect x="452" y="166" width="160" height="66" rx="12" fill="#A100FF"/>
      <text x="532" y="204" class="cart" fill="#ffffff" text-anchor="middle" style="font-size:14px">R$ 490</text>
      <rect x="626" y="166" width="160" height="66" rx="12" fill="#A100FF" fill-opacity="0.8"/>
      <text x="706" y="204" class="cart" fill="#ffffff" text-anchor="middle" style="font-size:14px">R$ 380</text>
      <rect x="452" y="244" width="160" height="44" rx="12" fill="#A100FF" fill-opacity="0.55"/>
      <text x="532" y="271" class="cart" fill="#ffffff" text-anchor="middle">R$ 220</text>
    </g>
    <text x="626" y="264" class="sum">3 compras</text>
    <text x="626" y="284" class="sum" style="fill:#A100FF">R$ 1.090 de receita</text>
    <text x="452" y="316" class="colDesc">Menos transações, mais receita — a régua vira ROAS e LTV</text>
  </g>

  <!-- requisitos -->
  <g>
    <rect x="40" y="356" width="760" height="52" rx="14" fill="#A100FF" fill-opacity="0.08"/>
    <text x="64" y="378" class="req" style="font-weight:700">Requisitos atuais para eventos de compra:</text>
    <text x="64" y="398" class="req">30 conversões atribuídas · mínimo 5 valores distintos · janela de 14 dias · valor e moeda no evento (ideal via CAPI)</text>
  </g>

  <text x="40" y="440" class="note"><tspan font-weight="700" fill="#A100FF">Andar avançado:</tspan> value rules ponderam segmentos que valem mais; pLTV envia o valor previsto do ciclo completo do cliente,</text>
  <text x="40" y="460" class="note">e o algoritmo passa a caçar o melhor cliente dos próximos doze meses, não o maior ticket de hoje.</text>
</svg>
