<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 440" role="img" aria-label="Os quatro formatos de venda do YouTube Shopping — marcação em vídeos e Shorts, aba de loja, lives com produto fixado e afiliados — todos direcionando ao checkout no site da marca">
  <style>
    text { font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif; }
    .title { font-size: 19px; font-weight: 700; fill: #111827; }
    .subtitle { font-size: 13px; fill: #6b7280; }
    .cardTitle { font-size: 13.5px; font-weight: 700; fill: #111827; }
    .cardDesc { font-size: 11px; fill: #6b7280; }
    .hub { font-size: 14px; font-weight: 700; fill: #ffffff; }
    .hubSub { font-size: 11px; fill: #d1d5db; }
  </style>

  <rect x="0" y="0" width="840" height="440" rx="16" fill="#ffffff" stroke="#e5e7eb"/>

  <text x="40" y="44" class="title">Como o YouTube Shopping vende</text>
  <text x="40" y="66" class="subtitle">Quatro frentes de venda sobre o maior acervo de reviews e comparativos da internet</text>

  <!-- setas para o hub -->
  <g stroke="#d8b4fe" stroke-width="2" fill="none">
    <path d="M 131,236 C 131,280 240,290 330,302"/>
    <path d="M 323,236 C 323,264 360,276 396,290"/>
    <path d="M 515,236 C 515,264 478,276 442,290"/>
    <path d="M 707,236 C 707,280 598,290 508,302"/>
  </g>
  <g fill="#A100FF">
    <path d="M 330,302 l -10,-5 2,9 z"/>
    <path d="M 396,290 l -10,-4 1,9 z"/>
    <path d="M 442,290 l 9,-4 -1,9 z"/>
    <path d="M 508,302 l 8,-8 -10,-2 z"/>
  </g>

  <!-- cards -->
  <g>
    <rect x="40" y="100" width="182" height="136" rx="14" fill="#faf5ff" stroke="#A100FF" stroke-opacity="0.4"/>
    <rect x="60" y="120" width="34" height="24" rx="6" fill="#A100FF"/>
    <path d="M 72,126 l 10,6 -10,6 z" fill="#ffffff"/>
    <text x="60" y="170" class="cardTitle">Vídeos e Shorts</text>
    <text x="60" y="192" class="cardDesc">Produtos citados aparecem</text>
    <text x="60" y="206" class="cardDesc">em prateleira clicável</text>
    <text x="60" y="220" class="cardDesc">junto ao conteúdo</text>
  </g>
  <g>
    <rect x="232" y="100" width="182" height="136" rx="14" fill="#faf5ff" stroke="#A100FF" stroke-opacity="0.4"/>
    <rect x="252" y="120" width="34" height="24" rx="6" fill="#A100FF"/>
    <path d="M 259,127 h 20 v 3 h -20 z M 259,133 h 20 v 3 h -20 z M 259,139 h 12 v 3 h -12 z" fill="#ffffff"/>
    <text x="252" y="170" class="cardTitle">Aba de loja do canal</text>
    <text x="252" y="192" class="cardDesc">Vitrine permanente da</text>
    <text x="252" y="206" class="cardDesc">marca dentro do YouTube</text>
  </g>
  <g>
    <rect x="424" y="100" width="182" height="136" rx="14" fill="#faf5ff" stroke="#A100FF" stroke-opacity="0.4"/>
    <rect x="444" y="120" width="34" height="24" rx="6" fill="#A100FF"/>
    <circle cx="461" cy="132" r="6" fill="none" stroke="#ffffff" stroke-width="2"/>
    <circle cx="461" cy="132" r="2" fill="#ffffff"/>
    <text x="444" y="170" class="cardTitle">Lives com produto</text>
    <text x="444" y="192" class="cardDesc">Live commerce com o item</text>
    <text x="444" y="206" class="cardDesc">em destaque durante a</text>
    <text x="444" y="220" class="cardDesc">transmissão</text>
  </g>
  <g>
    <rect x="616" y="100" width="182" height="136" rx="14" fill="#faf5ff" stroke="#A100FF" stroke-opacity="0.4"/>
    <rect x="636" y="120" width="34" height="24" rx="6" fill="#A100FF"/>
    <circle cx="648" cy="132" r="4" fill="#ffffff"/><circle cx="659" cy="132" r="4" fill="#ffffff" fill-opacity="0.7"/>
    <text x="636" y="170" class="cardTitle">Afiliados</text>
    <text x="636" y="192" class="cardDesc">Creators marcam seus</text>
    <text x="636" y="206" class="cardDesc">produtos e ganham</text>
    <text x="636" y="220" class="cardDesc">comissão rastreada</text>
  </g>

  <!-- hub -->
  <rect x="290" y="296" width="260" height="82" rx="16" fill="#111827"/>
  <text x="420" y="330" class="hub" text-anchor="middle">Checkout no site da marca</text>
  <text x="420" y="352" class="hubSub" text-anchor="middle">integração via Google Merchant Center —</text>
  <text x="420" y="366" class="hubSub" text-anchor="middle">o mesmo feed do Shopping e do PMax</text>

  <text x="40" y="414" style="font-size:11.5px; fill:#6b7280;">Um review continua vendendo por anos — o YouTube Shopping transforma conteúdo perene em prateleira.</text>
</svg>
