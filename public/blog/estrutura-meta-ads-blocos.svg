<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 500" role="img" aria-label="Estrutura de conta Meta Ads em três blocos por função: captação com Advantage+ Shopping, geração de demanda e teste de criativos, com exemplos de divisão de orçamento por estágio da operação">
  <style>
    text { font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif; }
    .title { font-size: 19px; font-weight: 700; fill: #111827; }
    .subtitle { font-size: 13px; fill: #6b7280; }
    .blockTag { font-size: 10px; font-weight: 700; letter-spacing: 0.08em; }
    .blockTitle { font-size: 14px; font-weight: 700; }
    .blockDesc { font-size: 11px; fill: #6b7280; }
    .budgetHead { font-size: 11.5px; font-weight: 700; fill: #111827; }
    .budgetLabel { font-size: 11px; fill: #6b7280; }
    .pct { font-size: 10.5px; font-weight: 700; fill: #ffffff; }
    .note { font-size: 11.5px; fill: #6b7280; }
  </style>

  <rect x="0" y="0" width="840" height="500" rx="16" fill="#ffffff" stroke="#e5e7eb"/>

  <text x="40" y="44" class="title">A espinha de três blocos, por função</text>
  <text x="40" y="66" class="subtitle">Cada campanha responde uma pergunta de negócio: capturar, gerar ou aprender</text>

  <!-- Bloco captação -->
  <g>
    <rect x="40" y="96" width="245" height="168" rx="14" fill="#111827"/>
    <rect x="60" y="116" width="86" height="20" rx="10" fill="#A100FF"/>
    <text x="103" y="130" class="blockTag" fill="#ffffff" text-anchor="middle">BLOCO 1</text>
    <text x="60" y="162" class="blockTitle" style="fill:#ffffff">Captação</text>
    <text x="60" y="186" class="blockDesc" style="fill:#d1d5db">Advantage+ Shopping consolidado,</text>
    <text x="60" y="201" class="blockDesc" style="fill:#d1d5db">maior fatia da verba, criativos</text>
    <text x="60" y="216" class="blockDesc" style="fill:#d1d5db">vencedores e teto de clientes</text>
    <text x="60" y="231" class="blockDesc" style="fill:#d1d5db">existentes configurado</text>
    <text x="60" y="252" class="blockDesc" style="fill:#d8b4fe; font-weight:700">Métrica: custo por cliente novo</text>
  </g>

  <!-- Bloco demanda -->
  <g>
    <rect x="297" y="96" width="245" height="168" rx="14" fill="#faf5ff" stroke="#A100FF" stroke-opacity="0.4"/>
    <rect x="317" y="116" width="86" height="20" rx="10" fill="#A100FF" fill-opacity="0.15"/>
    <text x="360" y="130" class="blockTag" fill="#A100FF" text-anchor="middle">BLOCO 2</text>
    <text x="317" y="162" class="blockTitle" style="fill:#111827">Geração de demanda</text>
    <text x="317" y="186" class="blockDesc">Topo e meio de funil permanentes:</text>
    <text x="317" y="201" class="blockDesc">creators, UGC, prova social e</text>
    <text x="317" y="216" class="blockDesc">lançamentos, construindo as</text>
    <text x="317" y="231" class="blockDesc">audiências que realimentam tudo</text>
    <text x="317" y="252" class="blockDesc" style="fill:#A100FF; font-weight:700">Métrica: alcance qualificado</text>
  </g>

  <!-- Bloco teste -->
  <g>
    <rect x="554" y="96" width="245" height="168" rx="14" fill="#faf5ff" stroke="#A100FF" stroke-opacity="0.4"/>
    <rect x="574" y="116" width="86" height="20" rx="10" fill="#A100FF" fill-opacity="0.15"/>
    <text x="617" y="130" class="blockTag" fill="#A100FF" text-anchor="middle">BLOCO 3</text>
    <text x="574" y="162" class="blockTitle" style="fill:#111827">Teste</text>
    <text x="574" y="186" class="blockDesc">Campanha apartada onde todo</text>
    <text x="574" y="201" class="blockDesc">criativo estreia com critério</text>
    <text x="574" y="216" class="blockDesc">definido antes; vencedores são</text>
    <text x="574" y="231" class="blockDesc">promovidos ao Bloco 1</text>
    <text x="574" y="252" class="blockDesc" style="fill:#A100FF; font-weight:700">Métrica: taxa de promoção</text>
  </g>

  <!-- orçamento por estágio -->
  <text x="40" y="308" class="budgetHead">Divisão de orçamento por estágio da operação</text>

  <!-- Tração -->
  <text x="40" y="338" class="budgetLabel">Em tração</text>
  <g>
    <rect x="180" y="324" width="434" height="20" rx="10" fill="#111827"/>
    <rect x="618" y="324" width="62" height="20" rx="10" fill="#A100FF" fill-opacity="0.35"/>
    <rect x="684" y="324" width="124" height="20" rx="10" fill="#A100FF"/>
    <text x="196" y="338" class="pct">70% captação</text>
    <text x="626" y="338" class="pct" style="fill:#6b21a8">10%</text>
    <text x="700" y="338" class="pct">20% teste</text>
  </g>

  <!-- Escala -->
  <text x="40" y="374" class="budgetLabel">Em escala</text>
  <g>
    <rect x="180" y="360" width="372" height="20" rx="10" fill="#111827"/>
    <rect x="556" y="360" width="155" height="20" rx="10" fill="#A100FF" fill-opacity="0.35"/>
    <rect x="715" y="360" width="93" height="20" rx="10" fill="#A100FF"/>
    <text x="196" y="374" class="pct">60% captação</text>
    <text x="564" y="374" class="pct" style="fill:#6b21a8">25% demanda</text>
    <text x="724" y="374" class="pct">15%</text>
  </g>

  <!-- Pressionada -->
  <text x="40" y="410" class="budgetLabel">Pressionada</text>
  <g>
    <rect x="180" y="396" width="341" height="20" rx="10" fill="#111827"/>
    <rect x="525" y="396" width="186" height="20" rx="10" fill="#A100FF" fill-opacity="0.35"/>
    <rect x="715" y="396" width="93" height="20" rx="10" fill="#A100FF"/>
    <text x="196" y="410" class="pct">55% captação</text>
    <text x="533" y="410" class="pct" style="fill:#6b21a8">até 30% demanda</text>
    <text x="724" y="410" class="pct">15%</text>
  </g>

  <text x="40" y="452" class="note">Com CAC subindo e clientes novos caindo, o problema é estoque de demanda: reforce o plantio em vez de espremer o fundo.</text>
  <text x="40" y="472" class="note">Mudanças de orçamento sempre graduais, preservando o aprendizado das campanhas.</text>
</svg>
