<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 460" role="img" aria-label="O ciclo de 10 a 15 minutos de uma live de vendas: demonstração do produto, respostas ao chat, oferta com prazo e chamada para compra, repetido a cada produto">
  <style>
    text { font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif; }
    .title { font-size: 19px; font-weight: 700; fill: #111827; }
    .subtitle { font-size: 13px; fill: #6b7280; }
    .stepTitle { font-size: 13px; font-weight: 700; fill: #111827; }
    .stepDesc { font-size: 10.5px; fill: #6b7280; }
    .center { font-size: 14px; font-weight: 700; fill: #A100FF; }
    .centerSub { font-size: 10.5px; fill: #6b7280; }
    .num { font-size: 13px; font-weight: 700; fill: #ffffff; }
    .note { font-size: 11.5px; fill: #6b7280; }
  </style>

  <rect x="0" y="0" width="840" height="460" rx="16" fill="#ffffff" stroke="#e5e7eb"/>

  <text x="40" y="44" class="title">O ciclo que segura audiência e converte</text>
  <text x="40" y="66" class="subtitle">Live que vende opera em blocos repetidos, não em narrativa linear — quem entra no minuto 47 entende em três</text>

  <!-- círculo central -->
  <circle cx="290" cy="260" r="64" fill="#faf5ff" stroke="#A100FF" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="290" y="252" class="center" text-anchor="middle">10–15 min</text>
  <text x="290" y="270" class="centerSub" text-anchor="middle">por produto,</text>
  <text x="290" y="283" class="centerSub" text-anchor="middle">e o ciclo recomeça</text>

  <!-- setas circulares -->
  <g fill="none" stroke="#A100FF" stroke-width="2.5">
    <path d="M 290,150 A 110,110 0 0 1 396,238"/>
    <path d="M 385,300 A 110,110 0 0 1 290,370"/>
    <path d="M 290,370 A 110,110 0 0 1 184,282"/>
    <path d="M 195,220 A 110,110 0 0 1 290,150"/>
  </g>
  <g fill="#A100FF">
    <path d="M 396,238 l -8,-8 10,-2 z"/>
    <path d="M 290,370 l 9,-6 1,10 z"/>
    <path d="M 184,282 l 8,8 -10,2 z"/>
    <path d="M 290,150 l -9,6 -1,-10 z"/>
  </g>

  <!-- etapas -->
  <g>
    <circle cx="290" cy="150" r="14" fill="#A100FF"/>
    <text x="290" y="155" class="num" text-anchor="middle">1</text>
    <text x="320" y="132" class="stepTitle">Demonstração rápida</text>
    <text x="320" y="149" class="stepDesc">produto em uso, sem enrolação</text>
  </g>
  <g>
    <circle cx="405" cy="260" r="14" fill="#A100FF"/>
    <text x="405" y="265" class="num" text-anchor="middle">2</text>
    <text x="432" y="252" class="stepTitle">Dúvidas do chat</text>
    <text x="432" y="269" class="stepDesc">2 ou 3 respostas ao vivo</text>
  </g>
  <g>
    <circle cx="290" cy="372" r="14" fill="#A100FF"/>
    <text x="290" y="377" class="num" text-anchor="middle">3</text>
    <text x="320" y="382" class="stepTitle">Oferta com prazo</text>
    <text x="320" y="399" class="stepDesc">kit, cupom de minutos ou estoque limitado real</text>
  </g>
  <g>
    <circle cx="176" cy="260" r="14" fill="#A100FF"/>
    <text x="176" y="265" class="num" text-anchor="middle">4</text>
    <text x="42" y="245" class="stepTitle">CTA de compra</text>
    <text x="42" y="262" class="stepDesc">chamada explícita com o</text>
    <text x="42" y="276" class="stepDesc">produto fixado na tela</text>
  </g>

  <!-- lateral: papéis e régua -->
  <g>
    <rect x="580" y="120" width="220" height="130" rx="14" fill="#faf5ff" stroke="#A100FF" stroke-opacity="0.35"/>
    <text x="600" y="150" class="stepTitle" style="fill:#A100FF">Dois papéis obrigatórios</text>
    <text x="600" y="174" class="stepDesc">Quem apresenta: conduz produto e oferta</text>
    <text x="600" y="192" class="stepDesc">Quem opera: fixa produtos, modera o</text>
    <text x="600" y="206" class="stepDesc">chat e dispara cupons</text>
    <text x="600" y="230" class="stepDesc" style="font-weight:600; fill:#374151">Live de uma pessoa só sacrifica a</text>
    <text x="600" y="244" class="stepDesc" style="font-weight:600; fill:#374151">conversão quando o chat esquenta</text>
  </g>
  <g>
    <rect x="580" y="270" width="220" height="120" rx="14" fill="#111827"/>
    <text x="600" y="300" class="stepTitle" style="fill:#ffffff">A régua é de performance</text>
    <text x="600" y="324" class="stepDesc" style="fill:#d1d5db">Receita por live e por hora</text>
    <text x="600" y="342" class="stepDesc" style="fill:#d1d5db">Custo por comprador novo</text>
    <text x="600" y="360" class="stepDesc" style="fill:#d1d5db">Audiência é meio, não meta</text>
  </g>

  <text x="40" y="436" class="note">Duração de referência: 1 a 3 horas, com os produtos heróis reaparecendo e o pico de oferta nos momentos de maior audiência.</text>
</svg>
