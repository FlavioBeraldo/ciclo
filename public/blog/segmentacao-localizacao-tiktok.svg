<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 440" role="img" aria-label="Os níveis de segmentação por localização do TikTok, de país a CEP, e os quatro perfis que realmente precisam de granularidade, com o aviso de que restringir demais estrangula a entrega">
  <style>
    text { font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif; }
    .title { font-size: 19px; font-weight: 700; fill: #111827; }
    .subtitle { font-size: 13px; fill: #6b7280; }
    .h { font-size: 13px; font-weight: 700; fill: #111827; }
    .lvl { font-size: 11px; font-weight: 700; fill: #ffffff; }
    .scale { font-size: 10px; fill: #6b7280; }
    .persona { font-size: 12px; font-weight: 700; fill: #111827; }
    .pdesc { font-size: 10.5px; fill: #6b7280; }
    .note { font-size: 11.5px; fill: #6b7280; }
  </style>

  <rect x="0" y="0" width="840" height="440" rx="16" fill="#ffffff" stroke="#e5e7eb"/>

  <text x="40" y="44" class="title">Granularidade é ferramenta, não virtude</text>
  <text x="40" y="66" class="subtitle">Use o nível mais amplo que ainda atende ao negócio — cada restrição encolhe a audiência e o aprendizado</text>

  <!-- funil de níveis -->
  <text x="40" y="100" class="h">Níveis de segmentação</text>
  <g>
    <rect x="40" y="112" width="360" height="26" rx="6" fill="#A100FF"/><text x="52" y="130" class="lvl">País</text>
    <rect x="40" y="142" width="300" height="26" rx="6" fill="#A100FF" fill-opacity="0.85"/><text x="52" y="160" class="lvl">Região / estado</text>
    <rect x="40" y="172" width="240" height="26" rx="6" fill="#A100FF" fill-opacity="0.7"/><text x="52" y="190" class="lvl">Área metropolitana</text>
    <rect x="40" y="202" width="180" height="26" rx="6" fill="#A100FF" fill-opacity="0.55"/><text x="52" y="220" class="lvl">Cidade</text>
    <rect x="40" y="232" width="110" height="26" rx="6" fill="#A100FF" fill-opacity="0.4"/><text x="52" y="250" class="lvl" style="fill:#4c1d95">CEP</text>
  </g>
  <text x="410" y="130" class="scale">← mais volume, mais aprendizado</text>
  <text x="160" y="250" class="scale">↓ menos volume</text>
  <text x="40" y="284" class="pdesc" style="fill:#A100FF; font-weight:700">Alcança quem está na área ou a frequenta —</text>
  <text x="40" y="300" class="pdesc" style="fill:#A100FF; font-weight:700">precisão probabilística, não garantida.</text>

  <!-- perfis -->
  <text x="440" y="100" class="h">Quem precisa de granularidade</text>
  <g>
    <rect x="440" y="112" width="360" height="42" rx="10" fill="#faf5ff" stroke="#A100FF" stroke-opacity="0.25"/>
    <text x="456" y="130" class="persona">Varejo físico e franquias</text>
    <text x="456" y="147" class="pdesc">Campanhas por loja ou cluster, com oferta e estoque locais</text>

    <rect x="440" y="160" width="360" height="42" rx="10" fill="#faf5ff" stroke="#A100FF" stroke-opacity="0.25"/>
    <text x="456" y="178" class="persona">Logística assimétrica</text>
    <text x="456" y="195" class="pdesc">"Chega hoje em [cidade]" só onde a promessa é verdadeira</text>

    <rect x="440" y="208" width="360" height="42" rx="10" fill="#faf5ff" stroke="#A100FF" stroke-opacity="0.25"/>
    <text x="456" y="226" class="persona">Testes regionais</text>
    <text x="456" y="243" class="pdesc">Validar produto, preço ou criativo numa praça antes da escala</text>

    <rect x="440" y="256" width="360" height="42" rx="10" fill="#faf5ff" stroke="#A100FF" stroke-opacity="0.25"/>
    <text x="456" y="274" class="persona">Eventos e ativações</text>
    <text x="456" y="291" class="pdesc">Feiras, pop-ups e datas locais</text>
  </g>

  <!-- aviso -->
  <rect x="40" y="316" width="760" height="46" rx="12" fill="#111827"/>
  <text x="60" y="338" class="note" style="fill:#ffffff"><tspan font-weight="700">O anti-padrão:</tspan> e-commerce nacional que segmenta só as capitais "onde vende mais" impede o algoritmo de achar</text>
  <text x="60" y="354" class="note" style="fill:#d1d5db">demanda nova e paga CPM maior pela restrição. Consolide geografias pequenas em campanhas por cluster.</text>

  <text x="40" y="392" class="note">Criativo local é o multiplicador: segmentar a geografia e rodar o criativo nacional desperdiça metade do valor.</text>
</svg>
