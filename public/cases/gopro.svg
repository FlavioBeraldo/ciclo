<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="640" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#051a05"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="640" height="240" fill="url(#bg)"/>
  <!-- glow blob -->
  <ellipse cx="500" cy="60" rx="180" ry="120" fill="url(#glow)"/>
  <!-- grid lines -->
  <line x1="0" y1="60" x2="640" y2="60" stroke="#ffffff" stroke-opacity="0.03"/>
  <line x1="0" y1="120" x2="640" y2="120" stroke="#ffffff" stroke-opacity="0.03"/>
  <line x1="0" y1="180" x2="640" y2="180" stroke="#ffffff" stroke-opacity="0.03"/>
  <line x1="160" y1="0" x2="160" y2="240" stroke="#ffffff" stroke-opacity="0.03"/>
  <line x1="320" y1="0" x2="320" y2="240" stroke="#ffffff" stroke-opacity="0.03"/>
  <line x1="480" y1="0" x2="480" y2="240" stroke="#ffffff" stroke-opacity="0.03"/>
  <!-- accent bar -->
  <rect x="48" y="56" width="3" height="56" rx="2" fill="#22c55e"/>
  <!-- brand -->
  <text x="68" y="96" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="800" fill="#ffffff" letter-spacing="-0.5">GoPro Brasil</text>
  <text x="68" y="124" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#22c55e" letter-spacing="3" font-weight="600">ESPORTES &amp; AVENTURA</text>
  <!-- badge -->
  <rect x="48" y="170" width="168" height="32" rx="16" fill="#A100FF" fill-opacity="0.15" stroke="#A100FF" stroke-opacity="0.4" stroke-width="1"/>
  <text x="132" y="191" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#A100FF" text-anchor="middle" font-weight="600" letter-spacing="1">CASE CICLO E-COMMERCE</text>
  <!-- decorative ring -->
  <circle cx="560" cy="120" r="72" stroke="#22c55e" stroke-opacity="0.08" stroke-width="1.5"/>
  <circle cx="560" cy="120" r="52" stroke="#22c55e" stroke-opacity="0.06" stroke-width="1.5"/>
  <circle cx="560" cy="120" r="32" stroke="#22c55e" stroke-opacity="0.1" stroke-width="2" stroke-dasharray="6 4"/>
</svg>
