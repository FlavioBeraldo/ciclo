<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="640" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1a0a05"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#f97316" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="640" height="240" fill="url(#bg)"/>
  <ellipse cx="480" cy="80" rx="200" ry="140" fill="url(#glow)"/>
  <!-- organic shapes -->
  <ellipse cx="540" cy="100" rx="90" ry="60" stroke="#f97316" stroke-opacity="0.07" stroke-width="1.5" transform="rotate(-15 540 100)"/>
  <ellipse cx="570" cy="130" rx="60" ry="40" stroke="#f97316" stroke-opacity="0.1" stroke-width="1.5" transform="rotate(-15 570 130)"/>
  <ellipse cx="520" cy="80" rx="30" ry="20" fill="#f97316" fill-opacity="0.05" transform="rotate(-15 520 80)"/>
  <!-- grid -->
  <line x1="0" y1="80" x2="640" y2="80" stroke="#ffffff" stroke-opacity="0.025"/>
  <line x1="0" y1="160" x2="640" y2="160" stroke="#ffffff" stroke-opacity="0.025"/>
  <!-- accent -->
  <rect x="48" y="56" width="3" height="56" rx="2" fill="#f97316"/>
  <!-- brand -->
  <text x="68" y="96" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="800" fill="#ffffff" letter-spacing="-0.5">Mamô Brasil</text>
  <text x="68" y="124" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#f97316" letter-spacing="3" font-weight="600">LIFESTYLE &amp; MODA</text>
  <!-- badge -->
  <rect x="48" y="170" width="168" height="32" rx="16" fill="#A100FF" fill-opacity="0.15" stroke="#A100FF" stroke-opacity="0.4" stroke-width="1"/>
  <text x="132" y="191" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#A100FF" text-anchor="middle" font-weight="600" letter-spacing="1">CASE CICLO E-COMMERCE</text>
</svg>
